<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LexiHalo BYOK AI 翻译</title>
  <link rel="stylesheet" href="assets/byok.css">
</head>
<body>
  <main>
    <header>
      <img src="assets/logo.svg" alt="LexiHalo">
      <div>
        <h1>LexiHalo BYOK AI 翻译</h1>
        <p>使用你自己的模型 API Key，翻译请求由扩展直接发送给模型服务商。</p>
      </div>
    </header>

    <section class="notice">
      API Key 保存在本机的 <code>chrome.storage.local</code> 中，不会上传到 LexiHalo 或其他中间服务器。请勿在共享电脑上保存密钥。
    </section>

    <section class="card">
      <h2 id="form-title">添加模型</h2>
      <form id="engine-form">
        <input id="engine-id" type="hidden">
        <div class="grid">
          <label>服务商
            <select id="provider" required>
              <option value="OpenAI">OpenAI</option>
              <option value="OpenRouter">OpenRouter</option>
              <option value="DeepSeek">DeepSeek</option>
              <option value="Google">Google Gemini</option>
              <option value="Anthropic">Anthropic Claude</option>
              <option value="Custom">OpenAI 兼容接口</option>
            </select>
          </label>
          <label>显示名称
            <input id="name" required maxlength="60" placeholder="例如：我的 GPT-4o mini">
          </label>
          <label>模型名称
            <input id="model" required maxlength="120" placeholder="例如：gpt-4o-mini">
          </label>
          <label>API Endpoint
            <input id="endpoint" type="url" required placeholder="https://api.openai.com/v1/chat/completions">
          </label>
          <label class="wide">API Key
            <input id="key" type="password" required autocomplete="off" placeholder="仅保存在本机">
          </label>
        </div>
        <div class="actions">
          <button type="submit" class="primary">保存模型</button>
          <button type="button" id="cancel-edit" hidden>取消编辑</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="section-heading">
        <h2>已配置模型</h2>
        <span id="status"></span>
      </div>
      <div id="empty">尚未配置 BYOK 模型。</div>
      <div id="engine-list"></div>
    </section>

    <section class="footer-note">
      保存后请刷新正在使用 LexiHalo 的网页，然后在“翻译引擎 → 自定义引擎”中选择该模型。
    </section>
  </main>
  <script src="assets/byok.js"></script>
</body>
</html>
